<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shri Swami Samarth - Daily Seva</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { display:flex; flex-direction:column; min-height:100vh; }
    .poll-body { flex:1; width:100%; max-width:860px; margin:0 auto; padding:28px 20px 36px; }
    .poll-tabs { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:18px; padding:6px; border:1px solid var(--border); border-radius:var(--r); background:var(--white); box-shadow:var(--shadow-sm); }
    .poll-tab { border:0; border-radius:10px; background:transparent; padding:11px 10px; color:var(--text-mid); font:600 .86rem "Inter",sans-serif; cursor:pointer; }
    .poll-tab.active { color:white; background:linear-gradient(135deg,var(--saffron),var(--saffron-dark)); box-shadow:0 2px 8px rgba(194,83,10,.24); }
    .question-card, .admin-card { background:var(--white); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:24px 26px; position:relative; overflow:hidden; }
    .question-card::before, .admin-card::before { content:""; position:absolute; inset:0 auto 0 0; width:5px; background:linear-gradient(180deg,var(--saffron),var(--saffron-dark)); }
    .q-label { color:var(--saffron); font-size:.72rem; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; }
    .q-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:18px; }.q-heading .q-text { margin-bottom:0; }
    .q-text { font:1.16rem/1.7 "Tiro Devanagari Marathi",serif; color:var(--text-dark); margin-bottom:18px; }
    .answer-options { display:grid; gap:10px; }
    .answer-options.compact-options { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .option-btn { display:flex; align-items:center; justify-content:flex-start; gap:14px; width:100%; padding:13px 16px; border:1.5px solid var(--border); border-radius:var(--r); background:white; color:var(--text-dark); cursor:pointer; font:1.02rem/1.45 "Tiro Devanagari Marathi",serif; text-align:left; transition:all .16s; }
    .option-btn:hover { border-color:var(--saffron-light); background:var(--saffron-bg); }
    .option-btn.selected { border-color:var(--saffron); background:linear-gradient(135deg,#FFF4EC,#FEE9CE); color:var(--saffron-dark); font-weight:700; }
    .option-badge { display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; min-width:34px; height:34px; padding:0 8px; border-radius:50%; background:linear-gradient(135deg,var(--saffron),var(--saffron-dark)); color:#fff; font:800 .85rem "Inter",sans-serif; }
    .vishesh-option { display:flex; align-items:center; gap:14px; width:100%; padding:13px 16px; border:1.5px solid var(--border); border-radius:var(--r); background:white; transition:all .16s; }
    .vishesh-option:hover { border-color:var(--saffron-light); background:var(--saffron-bg); }
    .vishesh-option.selected { border-color:var(--saffron); background:linear-gradient(135deg,#FFF4EC,#FEE9CE); }
    .vishesh-select { border:0; background:transparent; cursor:pointer; padding:0; display:flex; align-items:center; gap:14px; min-width:0; flex:1; color:var(--text-dark); text-align:left; font:1.02rem/1.45 "Tiro Devanagari Marathi",serif; }
    .id-chip { flex:0 0 auto; max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:6px 10px; border-radius:7px; background:var(--saffron-bg); border:1px solid var(--saffron-light); color:var(--saffron-dark); font:800 .73rem "Inter",sans-serif; letter-spacing:.2px; }
    .vishesh-text { min-width:0; flex:1; }
    .option-actions { display:flex; align-items:center; gap:6px; margin-left:auto; }
    .option-action { border:1px solid var(--border); border-radius:8px; background:white; padding:7px 9px; color:var(--text-light); font:600 .75rem "Inter",sans-serif; cursor:pointer; }.option-action:hover { border-color:var(--saffron-light); color:var(--saffron); background:var(--saffron-bg); }.option-action.delete:hover { border-color:#FCA5A5; color:var(--danger); background:#FEF2F2; }
    .chant-btn { flex:0 0 auto; border:1px solid var(--saffron-light); border-radius:8px; background:var(--saffron-bg); color:var(--saffron-dark); padding:7px 11px; font:700 .76rem "Inter",sans-serif; cursor:pointer; }.chant-btn:hover { background:var(--saffron); border-color:var(--saffron); color:white; }
    .nitya-option { display:flex; align-items:stretch; gap:10px; }.nitya-option .option-btn { flex:1; }.nitya-option .chant-btn { align-self:center; }
    .check { width:24px; height:24px; border:2px solid var(--saffron-light); border-radius:6px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; color:transparent; font:900 1rem/1 "Inter",sans-serif; }
    .vishesh-option.selected .check { background:var(--success); border-color:var(--success); color:white; box-shadow:0 1px 3px rgba(22,163,74,.3); }
    .empty { padding:24px; color:var(--text-light); text-align:center; border:1px dashed var(--border); border-radius:var(--r); }
    .submit-wrap { margin-top:18px; }.submit-wrap .btn { width:100%; padding:14px; font-size:1rem; border-radius:var(--r); }
    .admin-card { margin-top:18px; }.admin-card h2 { font-size:1rem; color:var(--text-mid); margin-bottom:6px; }.admin-card p { font-size:.84rem; color:var(--text-light); margin-bottom:14px; line-height:1.5; }
    .admin-fields { display:grid; grid-template-columns:minmax(100px,.35fr) 1fr auto auto; gap:10px; }.admin-fields input { min-width:0; padding:11px 12px; border:1.5px solid var(--border); border-radius:var(--r-sm); background:var(--cream); font: .9rem "Inter",sans-serif; outline:none; }.admin-fields input:focus { border-color:var(--saffron); background:white; }
    .chant-modal { position:fixed; inset:0; z-index:500; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(28,10,0,.58); }.chant-modal.show { display:flex; }.chant-dialog { position:relative; width:min(420px,100%); padding:30px 28px; border:1px solid var(--border); border-radius:22px; background:linear-gradient(135deg,#FFFDF9,#FFF1DF); box-shadow:0 16px 46px rgba(28,10,0,.42); text-align:center; }.chant-close { position:absolute; top:12px; right:14px; border:0; background:transparent; color:var(--text-light); font-size:1.7rem; line-height:1; cursor:pointer; }.chant-title { padding-right:24px; font:700 1.45rem/1.45 "Tiro Devanagari Marathi",serif; color:var(--text-dark); }.chant-text { margin:12px 0 20px; color:var(--text-mid); font:.92rem/1.55 "Tiro Devanagari Marathi",serif; }.chant-counter { --progress:0%; width:174px; aspect-ratio:1; margin:0 auto 14px; padding:10px; border:0; border-radius:50%; cursor:pointer; background:conic-gradient(var(--saffron-dark) var(--progress), var(--saffron-light) var(--progress) 100%); box-shadow:0 4px 14px rgba(194,83,10,.25); }.chant-counter:hover { transform:scale(1.025); }.chant-counter:focus-visible { outline:3px solid var(--text-dark); outline-offset:4px; }.chant-counter-inner { display:flex; align-items:center; justify-content:center; width:100%; height:100%; border-radius:50%; background:#FFF8EF; box-shadow:inset 0 0 0 1px var(--border); color:var(--text-dark); font:700 1.35rem "Inter",sans-serif; }.chant-sub-count { min-height:20px; margin-bottom:8px; color:var(--saffron-dark); font:700 .88rem "Inter",sans-serif; }.chant-help { color:var(--text-light); font-size:.83rem; }
    @media (max-width:600px) { .poll-body { padding:20px 14px 30px; }.poll-tabs { gap:4px; padding:4px; }.poll-tab { padding:10px 4px; font-size:.72rem; }.question-card,.admin-card { padding:20px 18px; }.admin-fields { grid-template-columns:1fr; }.admin-fields .btn { width:100%; }.answer-options.compact-options { grid-template-columns:1fr; }.vishesh-option { gap:10px; align-items:flex-start; }.vishesh-select { gap:10px; }.id-chip { max-width:125px; }.option-actions { flex-direction:column; }.nitya-option { gap:7px; }.nitya-option .chant-btn { padding:7px 8px; }.chant-dialog { padding:26px 22px; }.chant-title { font-size:1.08rem; line-height:1.4; }.chant-text { font-size:.78rem; line-height:1.45; margin:10px 0 16px; }.chant-counter { width:150px; }.chant-counter-inner { font-size:1.18rem; } }
  </style>
</head>
<body>
  <div class="top-bar">
    <button class="icon-btn" onclick="history.back()">← मागे</button>
    <span class="top-bar-title">श्री स्वामी समर्थ</span>
    <div class="user-chip"><div class="avatar" id="userAvatar">?</div><span class="user-chip-name" id="userName">...</span></div>
  </div>

  <main class="poll-body">
    <nav class="poll-tabs" aria-label="Seva sections">
      <button class="poll-tab active" type="button" data-tab="seva">Nitya Seva</button>
      <button class="poll-tab" type="button" data-tab="parents_namaskar">Namaskar</button>
      <button class="poll-tab" type="button" data-tab="vishesh_seva">Vishesh Seva</button>
    </nav>
    <section class="question-card" id="questionCard"></section>
    <section class="admin-card" id="adminCard" hidden>
      <h2>Add Vishesh Seva option</h2><p>Admins can add a unique option ID and its text. It will immediately appear in the Vishesh Seva poll for everyone.</p>
      <div class="admin-fields"><input id="optionId" maxlength="40" placeholder="Option ID (e.g. VS1)"/><input id="optionLabel" maxlength="300" placeholder="Option text"/><button class="btn btn-primary btn-sm" id="addOptionBtn" type="button">Add option</button><button class="btn btn-ghost btn-sm" id="cancelEditBtn" type="button" hidden>Cancel</button></div>
    </section>
    <div class="submit-wrap"><button class="btn btn-primary" id="submitBtn" disabled>Submit</button></div>
  </main>

  <div class="toast" id="toast"></div>
  <div class="chant-modal" id="chantModal" aria-hidden="true">
    <div class="chant-dialog" role="dialog" aria-modal="true" aria-labelledby="chantTitle">
      <button class="chant-close" id="chantClose" type="button" aria-label="Close">×</button>
      <div class="chant-title" id="chantTitle"></div>
      <div class="chant-text" id="chantText"></div>
      <button class="chant-counter" id="chantCounter" type="button" aria-label="Increase chant count"><span class="chant-counter-inner" id="chantCountText">0 / 0</span></button>
      <div class="chant-sub-count" id="chantSubCount" hidden></div>
      <div class="chant-help" id="chantHelp">Tap the circle to increase count</div>
    </div>
  </div>
  <script src="config.js"></script>
  <script type="module">
    import { addVisheshSevaOption, getVisheshSevaOptions, saveResponse, updateVisheshSevaOption } from "./firebase-client.js";

    const student = sessionStorage.getItem("currentStudent");
    if (!student) window.location.href = "index.html";
    const questions = CONFIG.POLL_QUESTIONS.filter(question => question.id === "seva" || question.id === "parents_namaskar");
    const answers = {};
    let visheshOptions = [];
    let selectedVisheshIds = new Set();
    let editingOptionId = null;
    const chantCounts = new Map();
    const nityaChantProgress = new Map();
    let activeChantOption = null;
    let activeChantMode = null;
    let activeTab = new URLSearchParams(window.location.search).get("tab") === "vishesh_seva" ? "vishesh_seva" : "seva";
    const card = document.getElementById("questionCard");
    const submitBtn = document.getElementById("submitBtn");

    const initials = student.split(" ").filter(Boolean).map(part => part[0].toUpperCase()).join("").slice(0, 2);
    document.getElementById("userName").textContent = initials;
    document.getElementById("userAvatar").textContent = initials.charAt(0) || "?";
    updateAdminCard();
    document.querySelectorAll(".poll-tab").forEach(tab => {
      tab.classList.toggle("active", tab.dataset.tab === activeTab);
      tab.addEventListener("click", () => switchTab(tab.dataset.tab));
    });
    submitBtn.addEventListener("click", submitResponse);
    document.getElementById("addOptionBtn").addEventListener("click", addOption);
    document.getElementById("cancelEditBtn").addEventListener("click", resetOptionForm);
    document.getElementById("chantClose").addEventListener("click", closeChantModal);
    document.getElementById("chantModal").addEventListener("click", event => { if (event.target === event.currentTarget) closeChantModal(); });
    document.getElementById("chantCounter").addEventListener("click", increaseChantCount);
    document.getElementById("optionLabel").addEventListener("keydown", event => { if (event.key === "Enter") addOption(); });

    await loadVisheshOptions();
    renderActiveTab();
    updateSubmitState();

    async function loadVisheshOptions() {
      try {
        const all = await getVisheshSevaOptions();
        visheshOptions = all.filter(option => (option.status || "active") === "active");
      }
      catch (error) { showToast("Vishesh Seva options could not be loaded", "error"); }
    }

    function switchTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll(".poll-tab").forEach(tab => tab.classList.toggle("active", tab.dataset.tab === tabId));
      updateAdminCard();
      renderActiveTab();
    }

    function updateAdminCard() {
      document.getElementById("adminCard").hidden = true;
    }

    function renderActiveTab() {
      if (activeTab === "vishesh_seva") return renderVisheshSeva();
      const question = questions.find(item => item.id === activeTab);
      const selected = answers[question.id]?.id;
      const nityaChantButton = question.id === "seva" ? `<button class="chant-btn" type="button" data-nitya-chant>Chant</button>` : "";
      card.innerHTML = `<div class="q-label">${escapeHTML(question.title)}</div><div class="q-heading"><div class="q-text">${escapeHTML(formatQuestion(question.text))}</div>${nityaChantButton}</div><div class="answer-options ${question.options.length === 2 ? "compact-options" : ""}">${question.options.map(option => `<button class="option-btn ${selected === option.id ? "selected" : ""}" type="button" data-option-id="${escapeHTML(option.id)}">${option.id.length === 1 ? `<span class="option-badge">${escapeHTML(option.id)}</span>` : ""}<span>${escapeHTML(option.label)}</span></button>`).join("")}</div>`;
      card.querySelectorAll(".option-btn").forEach(button => button.addEventListener("click", () => {
        answers[question.id] = question.options.find(option => option.id === button.dataset.optionId);
        renderActiveTab(); updateSubmitState();
      }));
      card.querySelectorAll("[data-nitya-chant]").forEach(button => button.addEventListener("click", openNityaChant));
    }

    function renderVisheshSeva() {
      const adminActions = isAdmin();
      card.innerHTML = `<div class="q-label">Today's poll</div><div class="q-text">Vishesh Seva</div>${visheshOptions.length ? `<div class="answer-options">${visheshOptions.map(option => `<div class="vishesh-option ${selectedVisheshIds.has(option.id) ? "selected" : ""}"><button class="vishesh-select" type="button" data-option-id="${escapeHTML(option.id)}"><span class="check">${selectedVisheshIds.has(option.id) ? "✓" : ""}</span>${adminActions ? `<span class="id-chip" title="${escapeHTML(option.id)}">${escapeHTML(option.id)}</span>` : ""}<span class="vishesh-text">${escapeHTML(option.label)}</span></button>${isMantraOption(option) ? `<button class="chant-btn" type="button" data-chant-id="${escapeHTML(option.id)}">Chant</button>` : ""}</div>`).join("")}</div>` : `<div class="empty">No active Vishesh Seva options available today.</div>`}`;
      card.querySelectorAll(".vishesh-select").forEach(button => button.addEventListener("click", () => {
        const id = button.dataset.optionId;
        selectedVisheshIds.has(id) ? selectedVisheshIds.delete(id) : selectedVisheshIds.add(id);
        renderVisheshSeva(); updateSubmitState();
      }));


      card.querySelectorAll("[data-chant-id]").forEach(button => button.addEventListener("click", () => openChantModal(button.dataset.chantId)));
    }

    function updateSubmitState() {
      const hasBaseAnswer = questions.some(question => answers[question.id]);
      const hasVisheshAnswer = selectedVisheshIds.size > 0;
      submitBtn.disabled = !hasBaseAnswer && !hasVisheshAnswer;
    }

    async function addOption() {
      const idInput = document.getElementById("optionId"), labelInput = document.getElementById("optionLabel");
      try {
        if (editingOptionId) {
          await updateVisheshSevaOption(editingOptionId, idInput.value, labelInput.value);
          selectedVisheshIds.delete(editingOptionId);
          showToast("✓ Vishesh Seva option updated");
        } else {
          await addVisheshSevaOption(idInput.value, labelInput.value);
          showToast("✓ Vishesh Seva option added");
        }
        resetOptionForm();
        await loadVisheshOptions();
        if (activeTab === "vishesh_seva") renderVisheshSeva();
        updateSubmitState();
      } catch (error) { showToast(error.message || "Option could not be added", "error"); }
    }

    function beginEdit(id) {
      const option = visheshOptions.find(item => item.id === id);
      if (!option) return;
      editingOptionId = id;
      document.getElementById("optionId").value = option.id;
      document.getElementById("optionLabel").value = option.label;
      document.getElementById("addOptionBtn").textContent = "Save changes";
      document.getElementById("cancelEditBtn").hidden = false;
      document.getElementById("optionId").focus();
      document.getElementById("adminCard").scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetOptionForm() {
      editingOptionId = null;
      document.getElementById("optionId").value = "";
      document.getElementById("optionLabel").value = "";
      document.getElementById("addOptionBtn").textContent = "Add option";
      document.getElementById("cancelEditBtn").hidden = true;
    }














    function isMantraOption(option) { return option.id.toUpperCase().includes("MANTRA"); }

    function getIntendedCount(option) {
      const match = option.label.match(/\(([^)]*?)\)/);
      const value = match ? match[1].trim() : "";
      const normalized = value.replace(/./g, character => {
        const code = character.charCodeAt(0);
        return code >= 0x0966 && code <= 0x096F ? String(code - 0x0966) : character;
      });
      return Number.parseInt(normalized, 10) || 0;
    }

    function getChantTitle(option) { return option.label.split("|")[0].replace(/\([^)]*\)/g, "").trim(); }

    function openChantModal(id) {
      const option = visheshOptions.find(item => item.id === id);
      if (!option) return;
      const intendedCount = getIntendedCount(option);
      if (!intendedCount) {
        showToast("Add the intended count in brackets, e.g. (11 वेळा)", "error");
        return;
      }
      activeChantOption = option;
      activeChantMode = "vishesh";
      document.getElementById("chantModal").classList.add("show");
      document.getElementById("chantModal").setAttribute("aria-hidden", "false");
      document.getElementById("chantTitle").textContent = getChantTitle(option);
      document.getElementById("chantText").textContent = option.label.includes("|") ? option.label.split("|").slice(1).join("|").trim() : "";
      updateChantModal();
    }

    function openNityaChant() {
      activeChantOption = { id: "nitya_seva_chant" };
      activeChantMode = "nitya";
      document.getElementById("chantModal").classList.add("show");
      document.getElementById("chantModal").setAttribute("aria-hidden", "false");
      document.getElementById("chantTitle").textContent = "Shri Swami Samarth Mantra Chant";
      document.getElementById("chantText").textContent = "Complete 108 chants to finish one mala.";
      updateChantModal();
    }

    function closeChantModal() {
      activeChantOption = null;
      activeChantMode = null;
      document.getElementById("chantModal").classList.remove("show");
      document.getElementById("chantModal").setAttribute("aria-hidden", "true");
    }

    function updateChantModal() {
      if (!activeChantOption) return;
      const isNityaChant = activeChantMode === "nitya" || activeChantOption.id === "nitya_seva_chant";
      const intendedCount = isNityaChant ? 108 : getIntendedCount(activeChantOption);
      const nityaProgress = nityaChantProgress.get(activeChantOption.id) || { count: 0, malas: 0 };
      const currentCount = isNityaChant ? nityaProgress.count : (chantCounts.get(activeChantOption.id) || 0);
      const targetCount = isNityaChant ? 108 : intendedCount;
      const progress = Math.min(100, (currentCount / targetCount) * 100);
      document.getElementById("chantCounter").style.setProperty("--progress", `${progress}%`);
      document.getElementById("chantCountText").textContent = `${currentCount} / ${targetCount}`;
      const subCount = document.getElementById("chantSubCount");
      subCount.hidden = !isNityaChant;
      subCount.textContent = isNityaChant ? `Mala count: ${nityaProgress.malas} / 11` : "";
      document.getElementById("chantHelp").textContent = isNityaChant ? "Tap the circle to chant. Every 108 chants completes one mala." : (currentCount >= intendedCount ? "Completed" : "Tap the circle to increase count");
    }

    function increaseChantCount() {
      if (!activeChantOption) return;
      const option = activeChantOption;
      if (activeChantMode === "nitya" || option.id === "nitya_seva_chant") {
        const progress = nityaChantProgress.get(option.id) || { count: 0, malas: 0 };
        const nextCount = progress.count + 1;
        if (nextCount < 108) {
          nityaChantProgress.set(option.id, { ...progress, count: nextCount });
          updateChantModal();
          return;
        }
        const nextMalas = progress.malas + 1;
        nityaChantProgress.set(option.id, { count: nextMalas === 11 ? 108 : 0, malas: nextMalas });
        if (nextMalas === 11) {
          showToast("✓ 11 malas completed");
          setTimeout(closeChantModal, 450);
        } else {
          updateChantModal();
          showToast(`✓ Mala ${nextMalas} of 11 completed`);
        }
        return;
      }
      const intendedCount = getIntendedCount(option);
      const currentCount = chantCounts.get(option.id) || 0;
      if (currentCount >= intendedCount) return;
      const nextCount = currentCount + 1;
      chantCounts.set(option.id, nextCount);
      updateChantModal();
      if (nextCount === intendedCount) {
        selectedVisheshIds.add(option.id);
        renderVisheshSeva();
        updateSubmitState();
        showToast("✓ Chant completed and option selected");
        setTimeout(closeChantModal, 450);
      }
    }

    async function submitResponse() {
      if (submitBtn.disabled) return;
      submitBtn.disabled = true;
      const responseAnswers = questions
        .filter(question => answers[question.id])
        .map(question => ({ questionId:question.id, questionTitle:question.title, question:formatQuestion(question.text), selectedOption:answers[question.id].id, optionText:answers[question.id].label }));
      responseAnswers.push({ questionId:"vishesh_seva", selectedOptionIds:[...selectedVisheshIds] });
      const sevaAnswer = responseAnswers.find(answer => answer.questionId === "seva");
      try {
        await saveResponse({ date:getTodayISO(), studentName:student, question:sevaAnswer?.question || "", selectedOption:sevaAnswer?.selectedOption || "", optionText:sevaAnswer?.optionText || "", answers:responseAnswers });
        showToast("✓ आपले उत्तर नोंदवले गेले!");
        setTimeout(() => { window.location.href = "daily.html"; }, 900);
      } catch (error) { updateSubmitState(); showToast(error.message || "उत्तर जतन झाले नाही", "error"); }
    }

    function formatQuestion(text) { return text.replace("{date}", getTodayDisplay()); }
    function escapeHTML(value) { const node = document.createElement("div"); node.textContent = value; return node.innerHTML; }
  </script>
</body>
</html>
